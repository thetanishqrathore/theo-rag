version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: theology_postgres
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: theology_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d theology_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: theology_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: theology_adminer
    restart: always
    ports:
      - "8085:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
  qdrant_data:
