[project]
name = "theo-rag"
version = "0.1.0"
description = "Evidence-first RAG system for theological teaching transcripts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "pymupdf==1.23.8",
    "sentence-transformers>=3.0.0",
    "qdrant-client==1.7.0",
    "ollama==0.1.6",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",
    "structlog==23.2.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.2",
    "pgvector==0.2.5",
    "docling>=2.70.0",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.11.0",
    "ruff==0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ingestion",
    "src/processing",
    "src/chunking",
    "src/embedding",
    "src/retrieval",
    "src/generation",
    "src/api",
    "src/observability",
    "src/telemetry",
    "src/corpus",
    "src/db",
    "src/utils",
]
